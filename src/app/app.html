  <a routerLink="/">Home</a> | <a routerLink="/about">About</a>
</nav>
<hr>
<h3>{{ count() }}</h3>
<hr>
<div>
  <button (click)="increment()">+</button>
  <button (click)="decrement()">-</button>
  <button (click)="reset()">reset</button>
</div>

<hr>
<h2>Inject</h2>
<p>{{ user.testname()  }}</p>
<button (click)="user.changeName('ALi')">Change</button>
<hr>
<h1>Input Component</h1>
<app-button
  name="subject"
  label="save"
  type="submit"
  (clicked)="saveUser()"
>
  <span>💾</span>
  slot content
</app-button>
<app-button
  name="subject"
  label="save"
  [disabled]="true"
>
</app-button>
<br><br>

<app-input
  label="Name"
  placeholder="Enter your name"
  [disabled]="true"
>
</app-input>

<br><br>

<app-input
  [(value)] = "username"
  label="Email"
  placeholder="Enter your email"
  type="email"
>
</app-input>

<hr>
<router-outlet></router-outlet>
