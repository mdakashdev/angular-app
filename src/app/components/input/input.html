<label for="name">{{ value }}</label>

<input
  id="name"
  [type]="type"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [readOnly]="readonly"
  [required]="required"
  [value]="value"
  (input)="onInput($event)"
/>

<!--[value]="value" parent - child-->
<!--(input)="onInput($event)",  মানে Child → Parent-->
